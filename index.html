<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132238">
  <title>釜山福岡旅伴 App</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div class="app-shell">
    <header class="hero card reveal">
      <div class="hero-copy">
        <p class="eyebrow">Trip Companion</p>
        <div class="hero-heading">
          <div>
            <h1>Busan + Fukuoka</h1>
            <p class="hero-subtitle">2026.10.21 - 2026.11.02</p>
          </div>
          <div class="route-pill">TPE → PUS → FUK → TPE</div>
        </div>
        <p class="hero-status" id="trip-status"></p>
      </div>

      <div class="progress-block">
        <div class="progress-label-row">
          <span>旅程進度</span>
          <span id="trip-progress-label"></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="trip-progress-fill"></div>
        </div>
      </div>

      <div class="hero-stats" id="hero-stats"></div>
    </header>

    <nav class="section-switch card reveal" aria-label="頁面導覽">
      <button type="button" class="switch-btn active" data-target="dashboard">總覽</button>
      <button type="button" class="switch-btn" data-target="timeline">每日</button>
      <button type="button" class="switch-btn" data-target="checklists">清單</button>
      <button type="button" class="switch-btn" data-target="logistics">移動</button>
    </nav>

    <main class="main-layout">
      <section class="panel active" id="dashboard">
        <div class="dashboard-grid">
          <article class="card reveal focus-card">
            <div class="section-head">
              <h2>目前焦點</h2>
              <span class="chip chip-accent" id="focus-chip"></span>
            </div>
            <div id="focus-card"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>旅程縮影</h2>
              <span class="chip">App Mode</span>
            </div>
            <div class="city-summary" id="city-summary"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>待確認雷達</h2>
              <span class="chip">不要漏掉</span>
            </div>
            <div class="reminder-list" id="reminder-list"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>旅程亮點</h2>
              <span class="chip">Key Days</span>
            </div>
            <div class="highlight-list" id="highlight-list"></div>
          </article>
        </div>
      </section>

      <section class="panel" id="timeline">
        <article class="card reveal">
          <div class="section-head">
            <h2>每日時間軸</h2>
            <span class="chip">13 Days</span>
          </div>
          <div class="day-pills" id="day-pills" aria-label="日期切換"></div>
          <div class="day-detail" id="day-detail"></div>
        </article>
      </section>

      <section class="panel" id="checklists">
        <article class="card reveal">
          <div class="section-head">
            <h2>旅行清單</h2>
            <span class="chip" id="checklist-chip"></span>
          </div>
          <div class="checklist-tabs" id="checklist-tabs"></div>
          <div class="checklist-progress">
            <div class="progress-label-row">
              <span>完成度</span>
              <span id="checklist-progress-label"></span>
            </div>
            <div class="progress-track soft">
              <div class="progress-fill" id="checklist-progress-fill"></div>
            </div>
          </div>
          <div class="checklist-panel" id="checklist-panel"></div>
        </article>
      </section>

      <section class="panel" id="logistics">
        <div class="dashboard-grid">
          <article class="card reveal">
            <div class="section-head">
              <h2>航班資訊</h2>
              <span class="chip">Flight</span>
            </div>
            <div class="flight-cards" id="flight-cards"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>住宿排程</h2>
              <span class="chip">Stay</span>
            </div>
            <div class="stay-cards" id="stay-cards"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>醫美與活動</h2>
              <span class="chip">Special</span>
            </div>
            <div class="note-grid" id="note-grid"></div>
          </article>

          <article class="card reveal">
            <div class="section-head">
              <h2>交通節點</h2>
              <span class="chip">Move</span>
            </div>
            <div class="transfer-list" id="transfer-list"></div>
          </article>
        </div>
      </section>
    </main>

    <nav class="bottom-nav card" aria-label="底部導覽">
      <button type="button" class="nav-btn active" data-nav="dashboard">
        <span class="nav-emoji">◉</span>
        <span>總覽</span>
      </button>
      <button type="button" class="nav-btn" data-nav="timeline">
        <span class="nav-emoji">◌</span>
        <span>每日</span>
      </button>
      <button type="button" class="nav-btn" data-nav="checklists">
        <span class="nav-emoji">◍</span>
        <span>清單</span>
      </button>
      <button type="button" class="nav-btn" data-nav="logistics">
        <span class="nav-emoji">◎</span>
        <span>移動</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
